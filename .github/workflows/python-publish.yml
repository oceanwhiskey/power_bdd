name: Test, build and publish to PyPI

# Every push runs the tests and builds the distributions.  A pushed tag
# (e.g. v2.0.0) additionally publishes them to PyPI by trusted publishing:
# no API token, PyPI trusts this workflow and the environment "pypi".

on: push

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, flint ${{ matrix.flint }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        flint: [false, true]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        if [ "${{ matrix.flint }}" = "true" ]; then pip install ".[test,flint]"; else pip install ".[test]"; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: pytest

  build:
    name: Build distributions
    needs: [test]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Check that the tag matches the version in pyproject.toml
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
        if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
          echo "tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
          exit 1
        fi
    - name: Build a wheel and a source tarball
      run: |
        python -m pip install --upgrade build
        python -m build --sdist --wheel --outdir dist/ .
    - uses: actions/upload-artifact@v4
      with:
        name: distributions
        path: dist/

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/power-bdd/
    permissions:
      id-token: write          # required for trusted publishing
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: distributions
        path: dist/
    - name: Publish distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
