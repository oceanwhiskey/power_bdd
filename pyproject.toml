[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "power_bdd"
version = "2.0.0"
authors = [
  { name="Ingo Wilms", email="ingo.wilms@gmail.com" },
]
description = "Exact power indices (Banzhaf, Shapley-Shubik, Deegan-Packel, Johnston) and minimum quotas of simple games via QOBDDs and dynamic programming"
readme = "README.md"
license = { file="LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "numpy >= 1.22",
  "sortedcontainers >= 2.0",
]
keywords = ["power index", "voting", "simple games", "weighted majority games",
            "Banzhaf", "Shapley-Shubik", "Johnston", "Deegan-Packel",
            "binary decision diagrams", "minimum quota"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
# fast exact polynomial arithmetic for the Kakimura-Terai methods
flint = ["python-flint >= 0.9"]
test = ["pytest >= 7"]

[project.urls]
"Homepage" = "https://github.com/oceanwhiskey/power_bdd"
"Bug Tracker" = "https://github.com/oceanwhiskey/power_bdd/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/power_bdd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
